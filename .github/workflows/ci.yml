name: Flow Finance CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feature/v7-recurring-foundation, feat/month-recurring-details, feat/month-close-explanation, fix/home-certified-availability, feat/goal-progress-clarity, fix/month-navigation-races, feat/month-category-breakdown, feat/movement-selection-summary, feat/quality-workbench-entrypoint]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flow-finance-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.13 validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile application
        run: python -m compileall -q app maintenance tests

      - name: Validate active frontend JavaScript
        run: node --check app/static/v4-ui.js

      - name: Validate monthly recurring UI behavior
        run: node --test tests/test_monthly_recurring_ui.cjs

      - name: Validate installation script syntax
        run: bash -n install-update-helper.sh

      - name: Run test suite
        env:
          FLOW_DB_PATH: ${{ runner.temp }}/flow-ci.db
          FLOW_UPDATE_ENABLED: '0'
        run: pytest -q

      - name: Build Docker image
        run: docker build --build-arg GIT_COMMIT=${{ github.sha }} -t flow-finance:ci .

      - name: Smoke-test Docker image
        run: docker run --rm --entrypoint python -e FLOW_DB_PATH=/tmp/flow-smoke.db -e FLOW_UPDATE_ENABLED=0 flow-finance:ci -c 'import app.main; assert app.main.app.title == "Flow Finance"'
